[package]
name = "rust-bitvmx-storage-backend"
version = "0.8.4"
edition = "2021"
description = "Rust BitVMX Storage Backend"
license = "MIT"
readme = "README.md"
repository = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend"
categories = ["database", "storage"]
keywords = ["rust", "storage", "backend", "BitVMX", "database", "RocksDB"]

[lib]
name = "storage_backend"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rocksdb = { version = "0.25.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["v4"] }
cocoon = "0.5.0"
hex = "0.4.3"
rand = "0.10.2"
redact = { version = "0.1", features = ["serde"] }
age = "0.12.1"
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", optional = true }
serde_yaml = { version = "0.9.34", optional = true }

[features]
default = []
ui = ["dep:crossterm", "dep:ratatui", "dep:serde_yaml"]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "backup_bench"
harness = false
